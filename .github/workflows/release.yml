name: Release images

# Publishes prebuilt, public container images for the api and workers services to the GitHub
# Container Registry (GHCR) so ConsoleVault can be deployed WITHOUT a local image build or Cloud
# Build. Cloud Run can deploy public GHCR images directly (cached ~1h). See docs/DEPLOY.md.
#
# Triggers on a version tag (v1.2.3) or manual dispatch. After the FIRST publish, make the two
# packages public once in GitHub → Packages → Package settings (Cloud Run can only pull public
# GHCR images anonymously).

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, e.g. v0.1.0 (used as the image tag)'
        required: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    name: build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, workers]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/consolevault-${{ matrix.service }}
          # On a tag push, semver tags derive from the ref; on manual dispatch, from the input.
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.inputs.tag }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build & push (linux/amd64 — Cloud Run runtime)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
